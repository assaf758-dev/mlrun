name: TEST release-notes harness
run-name: harness ${{ inputs.version }} prev=${{ inputs.previous_version }}
'on':
  workflow_dispatch:
    inputs:
      version:
        description: The version to promote (must already exist), without prefix v (e.g. 1.1.0-rc10)
        required: true
        type: string
      commit_sha:
        description: MLRun commit SHA to tag. Leave empty to derive it from the mlrun image revision label.
        required: false
        default: ''
        type: string
      ui_commit_sha:
        description: UI repo commit SHA to tag. Leave empty to derive it from the UI image revision label.
        required: false
        default: ''
        type: string
      previous_version:
        description: Previous version for release notes (without v prefix). Leave empty to derive the greatest tag below this version.
        required: false
        default: ''
        type: string
      source_artifactory_docker_repo:
        description: Source Artifactory Docker repository name
        required: false
        default: mlrun-staging/mlrun
        type: string
      target_docker_registries:
        description: Comma separated list of target docker registries to push promoted images to (e.g., ghcr.io/,quay.io/,registry.hub.docker.com/)
        required: false
        default: ghcr.io/,quay.io/,registry.hub.docker.com/
        type: string
      target_docker_repo:
        description: Target Artifactory Docker repository name (for promotion, used when target includes Artifactory)
        required: false
        default: mlrun
        type: string
      source_artifactory_pypi_repo:
        description: Source Artifactory PyPI repository name
        required: false
        default: mlrun-private-pypi-local
        type: string
      skip_images:
        description: 'Comma separated list of images to skip promoting, example: mlrun,mlrun-gpu,ui,api,jupyter'
        required: false
        default: ''
      skip_publish_pypi:
        description: Whether to skip promoting the python package to target PyPI repo
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      skip_create_tag_release:
        description: Whether to skip creating tag & release in Github
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
permissions:
  contents: write
  packages: write
jobs:
  prepare-inputs:
    name: Prepare inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      previous_version: ${{ steps.resolve.outputs.previous_version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      make_latest: ${{ steps.resolve.outputs.make_latest }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install automation requirements
      run: make install-automation-requirements
    - name: Resolve inputs
      id: resolve
      env:
        VERSION: ${{ github.event.inputs.version }}
        PREVIOUS_VERSION: ${{ github.event.inputs.previous_version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "python automation/version/version_file.py promotion-inputs \\\n  --version \"$VERSION\" \\\n  --previous-version \"$PREVIOUS_VERSION\" | tee -a \"$GITHUB_OUTPUT\"\n"
  update-release-notes:
    name: Update release notes
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_create_tag_release != 'true'
    needs:
    - prepare-inputs
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: 'make install-automation-requirements

        '
    - name: Generate release notes
      id: release-notes
      run: 'make release-notes

        '
      env:
        MLRUN_SKIP_CLONE: true
        MLRUN_RELEASE_BRANCH: ${{ github.ref_name }}
        MLRUN_RELEASE_NOTES_OUTPUT_FILE: release_notes.md
        MLRUN_RAISE_ON_ERROR: false
        MLRUN_VERSION: v${{ needs.prepare-inputs.outputs.version }}
        MLRUN_OLD_VERSION: v${{ needs.prepare-inputs.outputs.previous_version }}
    - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
      with:
        tag: v${{ needs.prepare-inputs.outputs.version }}
        bodyFile: release_notes.md
        makeLatest: ${{ needs.prepare-inputs.outputs.make_latest }}
        prerelease: ${{ needs.prepare-inputs.outputs.prerelease }}
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
