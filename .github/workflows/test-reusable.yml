name: Test Reusable

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        default: ''
    secrets:
      DOCKER_HUB_DOCKER_REGISTRY_USERNAME:
        required: true
      DOCKER_HUB_DOCKER_REGISTRY_PASSWORD:
        required: true
      SYSTEM_TEST_GITHUB_ACCESS_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: false
        default: ''

env:
  NAMESPACE: mlrun

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR=${{ inputs.pr_number }} NS=$NAMESPACE"
